<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5D5891">
{% seo %}
<link rel="icon" href="/img/server-icon.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
<script>try{var t=localStorage.getItem('sm-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="page-{{ page.slug | default: page.title | slugify | default: 'home' }}">
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
