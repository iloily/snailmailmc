{% assign p = include.post %}
<a class="post-feature" href="{{ p.url }}">
  <img src="{{ p.image | default: '/assets/img/island-900.webp' }}" alt="" width="900" height="563" loading="lazy">
  <div class="text">
    <p class="post-date">{{ p.category | default: "Update" }}, {{ p.date | date: "%B %-d, %Y" }}</p>
    <h3>{{ p.title }}</h3>
    <p>{{ p.description | default: p.excerpt | strip_html | truncate: 180 }}</p>
  </div>
</a>
